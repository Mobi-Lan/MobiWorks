<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모비폴리오</title>
<!-- 홈 화면에 올려 앱처럼 쓰기 위한 것들. PC 에서는 아무 일도 하지 않는다. -->
<link rel="manifest" href="/folio/manifest.webmanifest">
<link rel="icon" href="/folio/icon-256.png">
<link rel="apple-touch-icon" href="/folio/icon-256.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MobiFolio">
<meta name="theme-color" content="#0b1018">
<style>
/* 「MobiFolio Mini」 — 아이콘 격자를 밀도 높은 목록으로, 플레이어는 접었다 펴는 시트로.
   디자인 캔버스는 534x1142 이고 실제 창은 440x920 이라, px 값은 디자인 그대로 두고 줄 수만 줄어든다(약 14줄).
   글꼴은 디자인이 IBM Plex 를 쓰지만 보안 정책(font-src 'self')상 웹폰트를 못 받아 기존 묶음을 쓴다. */
:root{
  --bg:#0b1018; --bar:#0d1420; --inset:#111a26; --strip:#131c27;
  --line:#26303d; --line2:#1b2634; --line3:#16202c; --rowline:#131c27; --ctl:#23303f; --dash:#2b3a4b;
  --gold:#e2b866; --gold-hi:#f0d08a; --on-gold:#1a1608; --gold-dim:#a8833f; --gold-badge:#8a6f3a; --gold-badge-line:#3d3218;
  --title:#f4e7c8; --row:#dce3ea; --row-sub:#8b97a6; --mono:#9aa3b2; --ink:#e9ecf1;
  --ctl-ink:#c9d0da; --chip:#c2cad4; --faint:#6f7a8a; --faint2:#5c6878; --faint3:#4b5665; --bartext:#8f98a6;
  --ok:#7fe0bd; --ok-dot:#5fc7a4; --ok-line:rgba(95,199,164,.35);
  --track:#1e2a38; --play-bg:rgba(226,184,102,.07); --gold-fill:rgba(226,184,102,.12); --gold-line:rgba(226,184,102,.45);
  --pink:#ff6f9c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.35 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);
  background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none;
  /* 손가락으로 조금만 오래 눌러도 글자가 잡히고 확대 메뉴가 떴다.
     고르기는 **글을 넣는 칸에서만** 되게 한다. */
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,.mono.sel{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
/* 목록은 세로로만 끌리게 — 줄을 고르려고 옆으로 끌 때 화면이 같이 밀리지 않게 */
#list,#filters,#squeue,#snear{touch-action:pan-y}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
[hidden]{display:none!important}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
#app{height:100%;display:flex;flex-direction:column}

/* ── 머리 ── */
/* 「미니 창 · 폴리오 닫힘」 — 머리는 **44px 한 줄**(로고 버튼 · 이름 · 점 · 네모 버튼 넷)이고,
   검색·필터는 그 아래 따로 묶인 칸(#finder)이다. 색은 전부 토큰 이름 — 값은 tokens.css·folio-bridge.css 가 준다.
   디자인의 가는 선(#16202c·#131c27)은 `--line`/`--rowline` 이다 (`--line3` 은 tokens.css 가 밝은 선으로 덮는다). */
#hdr{flex-shrink:0;display:flex;flex-direction:column}
#brandrow{display:flex;align-items:center;gap:7px;height:44px;padding:0 10px;flex-shrink:0;
  border-bottom:1px solid var(--line);background:var(--bar)}
#brandrow b{font-size:13px;font-weight:700;color:var(--title);white-space:nowrap}
/* 로고 버튼(♪▶)은 shell.js 가 이 줄 맨 앞에 넣는다 — 여기서는 디자인 높이(24px)와 간격만 맞춘다 */
#brandrow #railBtn{height:24px;margin-right:0}
#finder{display:flex;flex-direction:column;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line)}
/* 연결 표시는 **점 하나**다.
   좁은 화면에서 「연결됨」 넉 자가 머리줄을 밀어내 로고가 세로로 접혔다.
   글자는 지우지 않고 화면에서만 감춘다 — 읽는 기계에는 그대로 들린다. */
#conn{display:flex;align-items:center;gap:5px;color:var(--ok)}
.a11y-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
#conn.off{color:var(--pink);border-color:var(--badline)}
#conn i{width:7px;height:7px;border-radius:50%;background:var(--ok-dot);display:block;flex-shrink:0}   /* 테 없는 7px 점 */
#conn.off i{background:var(--pink)}
#tools{margin-left:auto;display:flex;gap:7px}
.tb{width:28px;height:28px;border-radius:8px;border:1px solid var(--ctl);color:var(--row-sub);font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tb:active{background:var(--press)}
.tb.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
/* 연출(☰)은 **켜진 것이 기본**이고 디자인은 그 기본 상태를 테두리 버튼(골드 아님)으로 그린다 —
   그래서 켜짐에 골드를 칠하지 않고, 디자인에 없는 **꺼짐**만 흐리게 알린다. */
.tb.off{opacity:.45}
/* 값이 오기 전의 오버레이·연출 단추 — 자리는 지키고 흐리게만 */
#btnOv:disabled,#btnOpen:disabled{opacity:.45;cursor:default}
.tb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* 「방송」 알약 (시안 C) — 머리줄 오른쪽 도구 앞. 누르면 방송 창.
   방송 중: 분홍 점 깜빡 + 「방송 · 신청 n」, 대기 수는 골드 배지 */
#btnBc{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--ctl);
  font-size:11px;color:var(--chip);white-space:nowrap;flex-shrink:0;line-height:1}
#btnBc:active{background:var(--press)}
#btnBc b{font-weight:inherit}
#btnBc svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
#btnBc .bcdot{display:none;width:7px;height:7px;border-radius:50%;background:var(--pink);flex-shrink:0;animation:bcblink 1.4s infinite}
#btnBc .bcn{display:none;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--gold);color:var(--on-gold);font-size:10px;font-style:normal}
#btnBc.live{gap:6px;background:var(--badbg2);border-color:color-mix(in srgb,var(--pink) 50%,transparent);font-weight:700;color:var(--bad2)}
#btnBc.live .bcdot{display:inline-block}
#btnBc.live svg{display:none}
#btnBc.live .bcn{display:inline-flex}
@keyframes bcblink{0%,100%{opacity:1}50%{opacity:.25}}
/* 좁은 창(경량판 375 · 모바일) — 머리줄 도구가 다섯이라 시안의 알약 전체가 한 줄에 안 들어간다.
   꺼짐은 글자만(「방송」), 방송 중은 점 + 골드 배지만 남긴다 (전체 문구는 title) */
@media (width < 440px){
  #btnBc svg{display:none}
  #btnBc.live #bcT{display:none}
}
#search{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:9px;background:var(--inset);border:1px solid var(--ctl)}
#search svg{width:12px;height:12px;fill:none;stroke:var(--faint2);stroke-width:1.8;flex-shrink:0}
#q{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);font:inherit;font-size:11px}
#q::placeholder{color:var(--faint2)}
#kbd{font-size:9px;line-height:1;color:var(--faint2);border:1px solid var(--ctl);border-radius:4px;padding:3px 5px;white-space:nowrap;flex-shrink:0}
/* 알약 줄 — 재생목록이 늘면 가로로 넘친다. 좌우로 끌어서 굴리고, 「+ 목록」은 줄 밖에 고정한다
   (넘친 줄이 그냥 잘려 있어서 재생목록도 「+ 목록」도 손이 닿지 않았다). */
#filterrow{display:flex;gap:5px;align-items:center;min-width:0;font-size:10px;line-height:1}
#filters{flex:1;min-width:0;display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none;cursor:grab}
#filters::-webkit-scrollbar{display:none}
#filters.drag{cursor:grabbing}
#filters.more-r{-webkit-mask-image:linear-gradient(to right,#000 86%,transparent);mask-image:linear-gradient(to right,#000 86%,transparent)}
#filters.more-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 10%);mask-image:linear-gradient(to right,transparent,#000 10%)}
#filters.more-l.more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 10%,#000 86%,transparent);mask-image:linear-gradient(to right,transparent,#000 10%,#000 86%,transparent)}
/* 「목록 ▾」은 줄 밖에 고정이라 **줄지 않는다** — 그런데 보고 있는 재생목록 이름이 들어가면(서버는 200자까지 받는다)
   375 창에서 알약 줄을 0 으로 밀고 제 끝이 창 밖으로 잘렸다. 폭의 절반까지만 쓰고 이름은 말줄임. */
#plMenu{flex-shrink:0;max-width:50%;min-width:0}
#plMenu .pln{min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip{height:26px;padding:0 9px;border-radius:13px;display:inline-flex;align-items:center;gap:4px;line-height:1;
  border:1px solid var(--ctl);color:var(--chip);font-size:10px;white-space:nowrap;flex-shrink:0}
.chip .n{font-size:10px;color:var(--row-sub)}
.chip.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
.chip.on .n{color:var(--on-gold);opacity:.7}
.chip.add{border-style:dashed;border-color:var(--dash);color:var(--row-sub);padding:0 8px}

/* ── 목록 ── */
#list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
/* 고른 곡 막대(#selbar)는 목록 위에 떠 있다 — 막대가 떠 있는 동안은 목록 끝에 그만큼 여백을 둬서
   마지막 줄이 막대 밑에 숨지 않게 한다 */
body.selon #list{padding-bottom:52px}
#list.dragsel{cursor:crosshair}
#list.dim{opacity:.3;pointer-events:none}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;padding:8px 10px;
  border-bottom:1px solid var(--rowline);cursor:pointer}
.row:active{background:var(--press)}
.row.playing{background:color-mix(in srgb,var(--gold) 5%,transparent)}   /* rgba(226,184,102,.05) */
.row.sel{background:var(--gold-fill);box-shadow:inset 3px 0 0 var(--gold)}
.row .ens{width:28px;height:28px;border-radius:7px;border:1px solid var(--gold-line);background:var(--goldbg);
  color:var(--gold);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.row .ens.none{border-color:var(--ctl);background:transparent;color:var(--faint)}
.row .ens.e2{border-color:color-mix(in srgb,var(--gather) 40%,transparent);background:var(--gatherbg);color:var(--gold)}
.row .ens.e6{border-color:color-mix(in srgb,var(--run) 40%,transparent);background:var(--runbg);color:var(--run)}
.row .ens svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5}
/* 줄 앞 네모 = 곡 설정 단추. 크기·모양은 그대로 두고, 마우스를 올리면 그 위에 ⚙ 만 덮는다.
   폰은 touch.css ① 이 [role=button] 에 보이지 않는 40px 판을 깐다 (보이는 크기 그대로) */
.row .ens{position:relative;cursor:pointer}
@media (hover:hover){.row .ens:hover::after{content:"⚙";position:absolute;inset:-1px;border-radius:7px;display:flex;
  align-items:center;justify-content:center;background:var(--gold);color:var(--on-gold);font-size:13px;font-weight:400}}
.row .ens:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.row .txt{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.row .t{display:block;font-size:12px;font-weight:700;color:var(--row);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.playing .t{color:var(--gold)}
.row .s{display:block;font-size:10px;color:var(--row-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 방송 신청으로 들어온 곡 — 아티스트 옆 「· 신청 이름」 작은 분홍 글씨 (시안 C). 줄의 칸(제목/부제)은 그대로 두고
   둘째 줄에 곁들인다: 그 줄만 가로로 흘려 제목은 한 줄 전체, 부제와 신청 표시가 한 줄에 선다 (간격 6) */
.row .txt.req{flex-direction:row;flex-wrap:wrap;align-content:center;justify-content:flex-start;column-gap:6px}
.row .txt.req .t{flex:0 0 100%}
.row .txt.req .s{flex:0 1 auto;min-width:0}
.row .reqby{font-style:normal;font-size:10px;color:var(--pink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.row .d{font-size:10px;color:var(--mono)}
#empty{padding:44px 24px;text-align:center;color:var(--row-sub);font-size:12.5px;line-height:1.7}

/* ── 고른 곡 막대 ── */
#selbar{position:fixed;left:10px;right:10px;bottom:106px;z-index:6;display:flex;align-items:center;gap:6px;
  padding:7px 9px;border-radius:12px;background:var(--panel);border:1px solid var(--gold-line);
  box-shadow:0 10px 30px var(--shadow);font-size:12px}
#selbar b{color:var(--gold);margin-right:auto;font-weight:600;white-space:nowrap}
/* 재생목록 화면에서는 단추가 일곱(재생·담기·인원·↑·↓·제거·해제) — 470 폭 창에서 「선택 n」이 세 줄로 접히고 「해제」가
   잘렸다. 이 막대 안에서만 간격·안쪽 여백·글자를 조금 줄인다. */
#selbar{gap:4px;padding:6px 7px}
#selbar .sm{padding:0 7px;font-size:11px;height:25px}
#selbar #bUp,#selbar #bDown{padding:0 6px}
.sm{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--ctl);color:var(--ctl-ink);font-size:11.5px;
  display:inline-flex;align-items:center;line-height:1;flex-shrink:0}
.sm.pri{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}

/* ── 접힌 플레이어 ── */
#player{flex-shrink:0;z-index:5}   /* 두 줄이 각자 윗선·바탕을 갖는다 */
/* 합주가 끝났을 때의 물음 — 붙어 있던 사람들이 계속 치고 있을 수 있어 우리가 임의로 안 넘긴다 */
#askbar{display:flex;align-items:center;gap:7px;padding:7px 14px;border-bottom:1px solid var(--line3);
  background:var(--runbg);font-size:11.5px;color:var(--run)}
#askbar[hidden]{display:none!important}
#askT{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#instrow{display:flex;align-items:center;gap:7px;padding:8px 10px;border-top:1px solid var(--line);background:var(--bar)}
#instrow .lb{font-size:10px;color:var(--row-sub);white-space:nowrap}
/* 악기 칸은 브라우저 기본 〈select〉 가 아니다 — 그 목록은 미니 창을 덮고 앱 밖으로 삐져나왔다.
   누르면 아래에서 **앱 안의 시트**(#isheet)가 올라오고 그 안에서 스크롤한다. */
#instBtn{height:28px;padding:0 9px;border-radius:7px;background:var(--inset);border:1px solid var(--ctl);
  color:var(--row);font:inherit;font-size:11px;flex:1;min-width:0;display:flex;align-items:center;gap:6px;text-align:left}
#instT{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#instBtn .ar{flex-shrink:0;color:var(--faint2);font-size:10px}
/* 악기 고정 중 — 칸에 고정한 악기와 금색 핀 */
#instPin{flex-shrink:0;color:var(--gold);display:inline-flex}
#instBtn.pinned{border-color:var(--gold-line)}
#instBtn.pinned #instT{color:var(--gold)}
/* 전체 재생 — 악기 줄 바로 위. 오버레이 상세창의 「▶ 전체 재생」과 같은 일:
   지금 보고 있는 목록 전부를 대기열로 만들고 첫 곡부터 (같은 서버 길 /api/queue = engine.queue_set). */
#allrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line);background:var(--bar)}
#btnAll{height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--gold-line);background:var(--gold-fill);
  color:var(--gold);font-size:11px;font-weight:600;line-height:1;white-space:nowrap;flex-shrink:0}
#btnAll:disabled{opacity:.45}
#allT{flex:1;min-width:0;font-size:10px;color:var(--row-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btnEquip{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--gold-line);background:var(--gold-fill);
  color:var(--gold);font-size:11px;font-weight:600;line-height:1;white-space:nowrap;flex-shrink:0}
#btnEquip:disabled{opacity:.45}
#mainrow{position:relative;display:flex;align-items:center;gap:8px;padding:9px 10px 11px;cursor:pointer;
  border-top:1px solid var(--line);background:var(--bg)}
#btnMain{width:38px;height:38px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#btnMain.idle{background:var(--ctl)}
#btnMain .tri{width:0;height:0;border-left:11px solid var(--on-gold);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
#btnMain.idle .tri{border-left-color:var(--mono)}
#btnMain .sq{width:13px;height:13px;border-radius:3px;background:var(--on-gold)}
#nowwrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#nowT{font-size:12px;font-weight:700;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowsub{display:flex;gap:6px;font-size:10px;color:var(--row-sub);white-space:nowrap;min-width:0}
#nowA{min-width:0;overflow:hidden;text-overflow:ellipsis}
#nowA:empty{display:none}
#ctime{flex-shrink:0}
/* 탈것 탑승 중 — 게임이 연주를 받지 않는다 (CLI 로는 못 내린다). 재생을 미뤄 뒀으면 「내리면 재생」 */
.mountb{flex-shrink:0;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;line-height:1.3;
  border:1px solid var(--badline);color:var(--pink);background:var(--badbg2)}
.mountb[hidden]{display:none}
#skick .mountb{letter-spacing:0;margin-left:4px}
/* 재생바 — 줄 바닥에 **전폭 3px** (좌우 10px 안쪽) */
#bar{position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:2px;background:var(--track);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:2px;transition:width .4s linear}
#ctl{display:flex;gap:8px;flex-shrink:0}
#ctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--ctl);color:var(--chip);font-size:13px;
  display:inline-flex;align-items:center;justify-content:center}
/* ＋ = 지금 재생 중인 곡 담기 — 골드 테두리 */
#ctl #btnAddNow{border-color:var(--gold-line);background:var(--gold-fill);color:var(--gold);font-size:16px;font-weight:700;line-height:1}
#ctl button svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ── 펼친 플레이어 (시트) ── */
/* 시트는 창보다 커질 수 없다 — 넘치면 **시트 안**(#sbody)이 스크롤된다. 예전에는 높이 제한이
   없어서 작은 창(폰·주변 연주 탭)에서 아래쪽 줄이 화면 밖으로 밀려 손이 안 닿았다. */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bar);border-top:1px solid var(--gold-line);
  border-radius:14px 14px 0 0;box-shadow:0 -18px 44px var(--shadow);display:flex;flex-direction:column;max-height:calc(100% - 24px);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.9,.3,1)}
#sheet.open{transform:none}
#grab{width:34px;height:3px;border-radius:2px;background:var(--dash);margin:8px auto 0;cursor:pointer;flex-shrink:0}
#sbody{padding:10px 16px 14px;display:flex;flex-direction:column;gap:11px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
#nowline{display:flex;align-items:center;gap:11px;min-width:0}
#disc{width:54px;height:54px;flex-shrink:0}
#skick{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--gold-dim)}
#sT{font-size:19px;font-weight:700;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
#sS{font-size:11px;color:var(--bartext);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sprog{display:flex;align-items:center;gap:9px}
#sbar{flex:1;height:3px;border-radius:2px;background:var(--track);position:relative}
#sbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:var(--gold);transition:width .4s linear}
#stime{font-size:11px;color:var(--ctl-ink);white-space:nowrap}
#strans{display:flex;align-items:center;gap:10px;padding-top:2px}
#strans .rb{width:32px;height:32px;border-radius:50%;border:1px solid var(--ctl);color:var(--ctl-ink);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
#strans .rb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#sMain{width:46px;height:46px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#sMain.idle{background:var(--ctl)}
#sMain .sq{width:14px;height:14px;border-radius:4px;background:var(--on-gold)}
#sMain .tri{width:0;height:0;border-left:15px solid var(--on-gold);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:5px}
#sMain.idle .tri{border-left-color:var(--mono)}
#strans .gap{flex:1}
.tog{width:30px;height:30px;border-radius:15px;border:1px solid var(--ctl);color:var(--mono);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tog.on{background:var(--gold-fill);border-color:var(--gold-line);color:var(--gold)}
.tog svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* 펼친 플레이어의 탭 — 재생목록 / 주변 연주 */
#stabs{display:flex;border-top:1px solid var(--line3);font-size:12px;line-height:1;margin:0 -16px;padding:0 16px}
.stab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:32px;
  background:none;border:0;border-bottom:2px solid transparent;color:var(--row-sub);cursor:pointer;font:inherit}
.stab:hover{color:var(--chip)}
.stab.on{color:var(--gold);font-weight:700;border-bottom-color:var(--gold)}
.stab .n{font-size:10px;color:var(--faint)}
.stab .bdg{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;
  border-radius:9px;background:var(--gold);color:var(--on-gold);font-size:10px;font-weight:700;line-height:1}
#squeue{padding-top:8px;display:flex;flex-direction:column;gap:6px}
/* 주변 연주 — StartAt 이 같은 사람끼리 한 팀 */
#snear{padding-top:8px;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
#nhead{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--row-sub);line-height:1}
#nhead b{font-weight:400}
.ngrp{display:flex;flex-direction:column;gap:6px;padding-bottom:9px;border-bottom:1px solid var(--rowline)}
.ngrp:last-child{border-bottom:0}
.ngrp .top{display:flex;align-items:baseline;gap:8px;line-height:1.2}
.ngrp .song{font-size:13px;font-weight:700;color:var(--row);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ngrp.me .song{color:var(--gold)}
.ngrp .dist{margin-left:auto;font-size:10px;color:var(--row-sub);white-space:nowrap}
.ngrp .tags{display:flex;align-items:center;gap:7px;line-height:1;flex-wrap:wrap}
.ntag{display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:10px;border:1px solid var(--ctl);
  color:var(--chip);font-size:10px;white-space:nowrap}
.ntag.size{background:var(--runbg);border-color:color-mix(in srgb,var(--run) 40%,transparent);color:var(--run);font-weight:700}
.ntag.copy{border-color:var(--gold-line);color:var(--gold)}
.ngrp .time{margin-left:auto;font-size:10px;color:var(--mono);white-space:nowrap}
.ngrp .nbar{height:3px;border-radius:2px;background:var(--track);position:relative}
.ngrp .nbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--gold)}
.ngrp .mem{display:flex;gap:5px;flex-wrap:wrap}
.ngrp .mem span{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;
  border:1px solid var(--ctl);background:var(--inset);font-size:10px;color:var(--chip);white-space:nowrap;line-height:1}
.ngrp .mem i{font-style:normal;color:var(--row-sub)}
#nnote{font-size:10px;color:var(--faint);line-height:1.5;word-break:keep-all}
#qhead{display:flex;align-items:center;font-size:10px;letter-spacing:.14em;color:var(--faint)}
#qEdit{margin-left:auto;font-size:11px;letter-spacing:0;color:var(--gold-dim)}
.qrow{display:grid;grid-template-columns:13px 1fr auto;gap:9px;align-items:center;font-size:12px;min-height:26px;cursor:pointer;border-radius:6px}
.qrow:active{background:var(--press)}
.qrow span{color:var(--faint3)}
.qrow b{font-weight:400;color:var(--row);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow b .qi{font-size:10.5px;color:var(--row-sub);font-weight:400;margin-left:6px}
.qrow i{font-style:normal;color:var(--row-sub)}
.qrow.now b{color:var(--gold);font-weight:600}
#scrim{position:fixed;inset:0;z-index:6;background:transparent}

/* ── 악기 고르기 시트 ── 브라우저 기본 〈select〉 대신. 플레이어 시트(#sheet) 위에도 올라올 수 있어 z 가 더 높다.
   목록(#ilist)만 스크롤되고 머리(#ihead)는 붙어 있다. */
#iscrim{position:fixed;inset:0;z-index:8;background:var(--backdrop)}
#isheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bar);border-top:1px solid var(--gold-line);
  border-radius:14px 14px 0 0;box-shadow:0 -18px 44px var(--shadow);display:flex;flex-direction:column;
  height:min(72vh,calc(100% - 48px));transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.9,.3,1)}
/* 높이는 **고정** — 검색할 때마다 결과 수에 따라 시트가 오르내렸다. 남는 자리는 비워 둔다. */
#isheet.open{transform:none}
#ihead{flex-shrink:0;padding:12px 16px 8px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line3)}
#ikick{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--gold-dim)}
#iT{font-size:14px;font-weight:700;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ilist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:6px 8px 12px;
  scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
.irow{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--row)}
.irow:active{background:var(--press)}
.irow.on{background:var(--gold-fill);color:var(--gold);font-weight:600}
.irow .chk{width:14px;flex-shrink:0;text-align:center;color:var(--gold);font-size:11px}
.irow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .bd{flex-shrink:0;font-size:10px;padding:2px 6px;border-radius:8px;border:1px solid var(--gold-line);color:var(--gold);line-height:1.2}
.irow .bd.warn{border-color:var(--badline);color:var(--pink)}
.irow.def .nm{color:var(--row-sub)}
.irow.def.on .nm{color:var(--gold)}
/* 오버레이 악기 고르기와 같은 양식:
   종류 탭(「전체」 + [종류], 개수) · 검색칸 + 「장착」 + 고정 · 목록(지금 악기 금색) · 「n / 전체」.
   거르는 규칙은 /folio/inst_picker.js (루트 inst_picker.py 와 같은 검사를 돈다). */
#itabs{flex-shrink:0;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line3);scrollbar-width:none}
#itabs::-webkit-scrollbar{display:none}
#itabs .chip{flex-shrink:0}
#itabs{cursor:grab}
#itabs.drag{cursor:grabbing}
#itabs.more-r{-webkit-mask-image:linear-gradient(to right,#000 86%,transparent);mask-image:linear-gradient(to right,#000 86%,transparent)}
#itabs.more-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 10%);mask-image:linear-gradient(to right,transparent,#000 10%)}
#itabs.more-l.more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 10%,#000 86%,transparent);mask-image:linear-gradient(to right,transparent,#000 10%,#000 86%,transparent)}
#isearch{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid var(--line3)}
#iqbox{flex:1;min-width:0;height:30px;display:flex;align-items:center;gap:6px;padding:0 9px;border-radius:8px;
  background:var(--inset);border:1px solid var(--gold-dim)}
#iqbox svg{width:13px;height:13px;flex-shrink:0;fill:none;stroke:var(--row-sub);stroke-width:1.8;stroke-linecap:round}
#iq{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);font:inherit;font-size:12px}
#iq::placeholder{color:var(--faint)}
#iEquip{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--gold-line);background:var(--gold-fill);
  color:var(--gold);font-size:11px;font-weight:600;line-height:1;white-space:nowrap;flex-shrink:0}
/* 악기 고정 단추 — 켜면 금색 (오버레이의 고정 단추와 같은 말투) */
.pinbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--ctl);background:var(--inset);color:var(--chip);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pinbtn.on{border-color:var(--gold);background:var(--goldDim);color:var(--gold)}
.pinbtn svg,#instPin svg,.irow .pn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.irow .kd{flex-shrink:0;color:var(--gold-dim)}
.irow.on .kd{color:var(--gold)}
.irow.hi{background:var(--press)}
.irow.on.hi{background:var(--gold-fill)}
.irow .pn{flex-shrink:0;color:var(--gold);display:inline-flex}
#ifoot{flex-shrink:0;display:flex;justify-content:space-between;gap:8px;padding:6px 14px 10px;font-size:10px;color:var(--row-sub);
  border-top:1px solid var(--line3);white-space:nowrap}

/* ── 커버 고르기 시트 ── 줄 메뉴 「커버 고르기…」. 악기 시트와 같은 자리·모양.
   칸은 카드 모양(1 : 1.42) — 「번호대로」 · 앱 기본 · 내 이미지. 지금 고른 칸은 골드 테두리. */
#cscrim{position:fixed;inset:0;z-index:8;background:var(--backdrop)}
#csheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bar);border-top:1px solid var(--gold-line);
  border-radius:14px 14px 0 0;box-shadow:0 -18px 44px var(--shadow);display:flex;flex-direction:column;
  max-height:min(78vh,calc(100% - 40px));transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.9,.3,1)}
#csheet.open{transform:none}
#chead{flex-shrink:0;padding:12px 16px 8px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line3)}
#ckick{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--gold-dim)}
#cT{font-size:14px;font-weight:700;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:8px 14px 12px;
  scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
.csec{font-size:10px;letter-spacing:.14em;color:var(--faint);margin:8px 2px 6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.ccell{position:relative;aspect-ratio:1/1.42;border-radius:7px;overflow:hidden;cursor:pointer;background:var(--inset,#0f1620);
  border:1.5px solid var(--ctl);padding:0}
.ccell img{width:100%;height:100%;object-fit:cover;display:block}
.ccell.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-fill)}
.ccell .ck{position:absolute;right:4px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--gold);color:var(--on-gold);
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.ccell .nm{position:absolute;left:0;right:0;bottom:0;padding:10px 4px 3px;font-size:9px;color:#fff;text-align:center;
  background:linear-gradient(transparent,rgba(0,0,0,.65));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccell.auto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-style:dashed;
  color:var(--chip);font-size:11px;text-align:center;line-height:1.3}
.ccell.auto small{font-size:9.5px;color:var(--row-sub)}
.ccell.auto.on{color:var(--gold)}
#cfoot{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 16px 12px;border-top:1px solid var(--line3)}
#cfoot[hidden]{display:none}
#cHint{font-size:10.5px;color:var(--faint);line-height:1.4;min-width:0;flex:1}
/* 「번호대로」 칸 — 자동으로 받는 그림(대개 생성 커버)을 그대로 보인다 (기본값) */
.ccell.auto.img{display:block;border-style:solid}
.ccell.auto.img .nm b{font-weight:700}
/* 「온라인에서 찾기」 (선택 기능) — 사람이 누를 때만 찾는다. 후보는 카드 모양 칸:
   정사각형 앨범 그림을 흐린 확대 배경 위 가운데에 (연출 카드와 같은 모양), 아래에 제목·아티스트·앨범, 왼쪽 위에 출처 */
.conl{display:flex;gap:6px;align-items:center;margin:2px 0 4px}
.conl input{flex:1;min-width:0;height:26px;border-radius:7px;border:1px solid var(--ctl);background:var(--inset,#0f1620);
  color:var(--ink);font:inherit;font-size:11.5px;padding:0 8px;outline:none}
.conl input:focus{border-color:var(--gold-line)}
.cnote{font-size:10px;color:var(--faint);line-height:1.4;margin:0 2px 6px}
.cmsg{font-size:11px;color:var(--row-sub);margin:4px 2px 6px;line-height:1.45;word-break:keep-all}
.cmsg.bad{color:var(--pink,#ff6f9c)}
.cgrid.og{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}   /* 후보 칸은 글씨 석 줄이 들어가게 조금 크게 */
.ocell{position:relative;aspect-ratio:1/1.42;border-radius:7px;overflow:hidden;cursor:pointer;background:#111;
  border:1.5px solid var(--ctl);display:flex;flex-direction:column}
.ocell.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-fill)}
.ocell.busy{opacity:.55;cursor:progress}
.ocell .bg{position:absolute;inset:-14%;background:var(--t) center/cover no-repeat;filter:blur(10px) brightness(.62)}
.ocell .sqi{position:relative;width:100%;aspect-ratio:1/1;background:var(--t) center/contain no-repeat}
.ocell .tx{position:relative;flex:1;min-height:0;padding:3px 5px 4px;display:flex;flex-direction:column;justify-content:flex-end;
  gap:1px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.ocell .tx span{font-size:8.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.ocell .tx b{font-size:9.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.ocell .src{position:absolute;left:4px;top:4px;padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;
  font-size:8.5px;font-weight:700;letter-spacing:.02em}
.ocell a{position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;
  font-size:10px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.ocell a:hover{background:var(--gold);color:var(--on-gold)}
/* 「내 이미지 관리 ›」 — 시트 바닥의 작은 글자 링크 (쓰는 내 이미지를 보는 페이지는 따로) */
#cManage{flex-shrink:0;font-size:11px;color:var(--gold);text-decoration:none;white-space:nowrap}
#cManage:hover{color:var(--gold-hi);text-decoration:underline}

/* ── 곡 설정 시트 (전 이름 「곡 상세」) ── 「이 곡엔 이 인사·이 커버·이 악기」를 한 곳에서.
   목록 줄은 「제목 / 아티스트 · 길이」 셋뿐이라 줄에 단추를 더할 자리가 없다 — 그래서 시트다.
   들어오는 길: 줄 앞 네모 · 줄 메뉴 맨 위 「곡 설정 (악기·커버·인사)…」 · 펼친 플레이어의 제목. 줄을 누르면 **있는 시트**(악기 · 커버)를 그 위에 연다
   — 그래서 z 는 악기·커버 시트와 같고 DOM 에서 그 둘보다 앞에 둔다 (같은 z 면 뒤의 것이 위). */
#dscrim{position:fixed;inset:0;z-index:8;background:var(--backdrop)}
#dsheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bar);border-top:1px solid var(--gold-line);
  border-radius:14px 14px 0 0;box-shadow:0 -18px 44px var(--shadow);display:flex;flex-direction:column;
  max-height:min(84vh,calc(100% - 32px));transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.9,.3,1)}
#dsheet.open{transform:none}
/* **닫힌 시트는 그림자도 없다** (가만히 있는데 아래가 어두워 보였다).
   닫힌 넷은 화면 바로 아래(translateY 100%)에 붙어 있을 뿐이라, 위로 드리우는 그림자(0 -18px 44px)가
   바닥 62px 안으로 새어 들어와 발 줄·재생 막대를 넷 겹으로 덮었다 (실측 밝기 16 → 2, 막대 35 → 3).
   그림자는 열렸을 때만 · 닫는 움직임이 끝나면 아예 감춘다(탭 순서·읽기 기계에서도 빠진다).
   여는 쪽은 위의 기본 규칙(visibility 없음 → 곧바로 보임)을 탄다. */
#sheet:not(.open),#isheet:not(.open),#csheet:not(.open),#dsheet:not(.open){box-shadow:none;visibility:hidden;
  transition:transform .24s cubic-bezier(.2,.9,.3,1),visibility 0s linear .26s}
#dhead{flex-shrink:0;display:flex;gap:12px;align-items:center;padding:14px 16px 12px;border-bottom:1px solid var(--line3)}
#dCover{position:relative;width:64px;aspect-ratio:1/1.42;flex-shrink:0;border-radius:7px;overflow:hidden;
  background:var(--inset);border:1px solid var(--ctl)}
#dCover img{width:100%;height:100%;object-fit:cover;display:block}
#dCover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--faint)}
#dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#dId{font-size:10px;letter-spacing:.08em;color:var(--gold-dim)}
#dT{font-size:15px;font-weight:700;color:var(--title);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all}
#dA{font-size:11px;color:var(--row-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dA:empty{display:none}
#dMeta{font-size:10px;color:var(--faint);line-height:1.45}
#dbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:2px 12px 8px;
  scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
.drow{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 4px;border-bottom:1px solid var(--rowline);cursor:pointer}
.drow:active{background:var(--press)}
.drow.ro{cursor:default}
.drow.ro:active{background:none}
.drow .lb{width:52px;flex-shrink:0;font-size:11px;color:var(--row-sub)}
.drow .v{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.drow .v b{font-size:12.5px;font-weight:600;color:var(--row);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .v b.over{color:var(--faint);text-decoration:line-through}
.drow .v small{font-size:10px;color:var(--faint);line-height:1.4;word-break:keep-all}
.drow .v .pin{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--gold)}
.drow .v .pin svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.drow .ar{flex-shrink:0;color:var(--faint2);font-size:13px}
.dpls{display:flex;flex-wrap:wrap;gap:5px}
.dpls .chip{max-width:100%}
.dpls .chip .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpls .chip .n{max-width:120px;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.dopts{padding:4px 0 6px 56px;border-bottom:1px solid var(--rowline)}
.dopts .irow{min-height:36px;font-size:12px}
.dopts .irow.edit .nm{color:var(--gold-dim)}
#dfoot{flex-shrink:0;padding:10px 16px 12px;border-top:1px solid var(--line3)}
#dPlay{width:100%;height:36px;border-radius:9px;background:var(--gold);color:var(--on-gold);font-size:12.5px;font-weight:700;line-height:1}
#sT{cursor:pointer}

/* ── 그 밖 ── */
#toast{position:fixed;inset:auto;left:50%;bottom:112px;transform:translateX(-50%);margin:0;width:max-content;max-width:92%;z-index:12;
  padding:9px 14px;border-radius:12px;background:var(--badbg);border:1px solid var(--badline);
  color:var(--ink);font-size:12.5px;box-shadow:0 8px 24px var(--shadow)}
#toast.ok{background:var(--goldbg);border-color:var(--gold-line)}
/* 고른 곡 막대가 떠 있으면 그 위로 — 막대(바닥 106 · 높이 39)와 쪽지(바닥 112)가 겹쳐 「▶ 재생」「+ 담기」… 를
   덮었다. 시트 규칙이 뒤에 있어 시트가 열렸을 때는 그쪽이 이긴다. */
body.selon #toast{bottom:calc(106px + 39px + 10px + var(--sab))}
/* 시트가 열려 있으면 그 위로 — 안 그러면 안내 쪽지가 재생 단추를 덮는다 */
body.sheeton #toast{bottom:calc(var(--sheeth,300px) + 10px)}
/* ── 아래 안전 영역 (아이폰 홈 막대) ── 이 화면은 `viewport-fit=cover` 라 바닥이 홈 막대 밑까지 내려간다.
   발 줄·시트 발·막대·쪽지를 그만큼 올린다. PC·안전 영역 없는 기기에서는 0 — 모양 그대로. */
:root{--sab:env(safe-area-inset-bottom, 0px)}
#mainrow{padding-bottom:calc(11px + var(--sab))}
#ifoot{padding-bottom:calc(10px + var(--sab))}
#cfoot{padding-bottom:calc(12px + var(--sab))}
#dfoot{padding-bottom:calc(12px + var(--sab))}
#sbody{padding-bottom:calc(14px + var(--sab))}
#selbar{bottom:calc(106px + var(--sab))}
#toast{bottom:calc(112px + var(--sab))}
body.selon #list{padding-bottom:calc(52px + var(--sab))}
dialog{border:none;border-radius:14px;background:var(--panel);color:var(--ink);padding:16px;width:min(92vw,340px);
  box-shadow:0 20px 60px var(--shadow)}
dialog::backdrop{background:var(--backdrop)}
dialog input{width:100%;margin-top:10px;padding:9px 11px;border-radius:9px;background:var(--inset);
  border:1px solid var(--ctl);color:var(--ink);font:inherit;outline:none}
.dlgrow{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.menu{position:fixed;z-index:20;min-width:180px;max-width:260px;padding:6px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);box-shadow:0 16px 40px var(--shadow);font-size:12.5px}
.menu div{padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu div:active{background:var(--press)}
.menu .hd{color:var(--row-sub);cursor:default;font-size:11px}

</style>

async function listsApi(body){const r=await api("/api/playlists",body);if(r&&r.playlists)S.lists=r.playlists;if(!r||r.ok===false)toast("재생목록 저장 실패: "+(r&&(r.message||r.error)||""));return r;}

/* ── 렌더 ── */
function viewName(){const v=S.view;
  if(v.kind==="pl"){const pl=S.lists.find((p)=>p.id===v.id);return pl?pl.name:"재생목록";}
  return {lib:"전체",recent:"최근",solo:"솔로",ens:"합주",queue:"현재 재생목록"}[v.kind]||"전체";}
function currentItems(){const v=S.view;let items=S.all;
  if(v.kind==="queue")return (S.queue||[]).map((x)=>Object.assign({},libOf(x)||{},x));
  if(v.kind==="pl"){const pl=S.lists.find((p)=>p.id===v.id);items=pl?pl.items.map((it,k)=>({...(libOf(it)||{title:it.title,song:it.title,cleaned:it.title,artist:"",missing:true}),key:it.key,plInst:it.inst,plIndex:k})):[];}
  if(v.kind==="recent")items=[...S.all.filter((i)=>i.lastPlayed)].sort((a,b)=>b.lastPlayed-a.lastPlayed);
  if(v.kind==="solo")items=S.all.filter((i)=>ensOf(i)===1);
  if(v.kind==="ens")items=S.all.filter((i)=>ensOf(i)>=2);
  if(S.q){const qt=S.q.toLowerCase().split(/\s+/).filter(Boolean);items=items.filter((i)=>qt.every((t)=>(i.norm||"").includes(t.replace(/[\s\-_.]/g,""))||(i.artist||"").toLowerCase().includes(t)||(i.title||"").toLowerCase().includes(t)));}
  return items;}

/* 「▶ 전체 재생」 — 악기 고르기 위, 지금 목록 전체를 대기열로 등록한다.

   (검색으로 거른 것과 상관없이)를 대기열로 만들고 첫 곡부터 — POST /api/queue = engine.queue_set. */
function viewAll(){const v=S.view;
  if(v.kind==="queue")return {items:(S.queue||[]).map((x)=>({key:x.key,title:x.title,inst:x.inst||""})),src:S.src||"queue",name:S.qname||viewName()};

$("btnAll").onclick=(e)=>{e.stopPropagation();playViewAll();};
function renderFilters(){const v=S.view,f=$("filters");

    `<button class="chip ${v.kind==="lib"?"on":""}" data-v="lib">전체 <span class="n mono">${S.all.length}</span></button>`+

    `<button class="chip ${v.kind==="ens"?"on":""}" data-v="ens" title="합주 인원을 2 이상으로 지정한 곡">합주 <span class="n mono">${S.all.filter((i)=>ensOf(i)>=2).length}</span></button>`;

/* 재생목록 고르기 — 목록을 열고, 지금 보고 있는 목록이면 그 목록에 대한 명령까지 붙인다. */

/* 알약 줄 좌우 굴리기 — 끌어서, 휠로. 오버레이 상세창도 같은 방식이다. */
function chipEdges(){const f=$("filters");const over=f.scrollWidth>f.clientWidth+1;
  f.classList.toggle("more-r",over&&f.scrollLeft+f.clientWidth<f.scrollWidth-1);
  f.classList.toggle("more-l",over&&f.scrollLeft>1);}
/* 알약 줄 하나에 끌기·휠·가장자리 흐림을 붙인다 — 위쪽 필터 줄과 악기 시트의 악기 탭 줄이 같은 것을 쓴다
   (악기 탭은 스크롤 막대를 숨겨 두고 굴릴 길이 없었다). */
function hscrollStrip(f,edges){let down=false,x0=0,sl=0,moved=false;
  f.addEventListener("pointerdown",(e)=>{
    if(e.pointerType==="touch")return;        // 알약 줄도 마찬가지 — 손가락은 브라우저가 알아서 민다
    down=true;moved=false;x0=e.clientX;sl=f.scrollLeft;});
  f.addEventListener("pointermove",(e)=>{if(!down)return;const dx=e.clientX-x0;
    if(!moved){if(Math.abs(dx)<4)return;moved=true;f.classList.add("drag");try{f.setPointerCapture(e.pointerId);}catch{}}
    f.scrollLeft=sl-dx;edges();});
  const up=()=>{if(!down)return;down=false;f.classList.remove("drag");
    // 끌고 난 **바로 다음** 클릭만 삼킨다 — 줄 밖에서 손을 떼면 클릭이 안 와서 그대로 남는다 (목록 쪽과 같은 고침)
    if(!moved)return;
    const eat=(ev)=>{ev.stopPropagation();ev.preventDefault();};
    f.addEventListener("click",eat,{capture:true,once:true});
    setTimeout(()=>f.removeEventListener("click",eat,{capture:true}),300);};
  f.addEventListener("pointerup",up);f.addEventListener("pointercancel",up);f.addEventListener("pointerleave",up);
  f.addEventListener("wheel",(e)=>{if(f.scrollWidth<=f.clientWidth+1)return;e.preventDefault();
    f.scrollLeft+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY);edges();},{passive:false});
  f.addEventListener("scroll",edges);
  window.addEventListener("resize",edges);}
function stripEdges(f){return ()=>{const over=f.scrollWidth>f.clientWidth+1;
  f.classList.toggle("more-r",over&&f.scrollLeft+f.clientWidth<f.scrollWidth-1);
  f.classList.toggle("more-l",over&&f.scrollLeft>1);};}

function renderList(){const items=currentItems();S._items=items;const g=$("list");const st=g.scrollTop;

       줄의 고르기(click)·재생(dblclick)으로 번지지 않게 여기서 멈춘다. 줄을 누르는 것은 그대로 고르기다 */

    t.oncontextmenu=(e)=>{e.preventDefault();const it=S.byKey.get(k)||items.find((x)=>x.key===k);const m=[[it?it.title:k,null],[SONG_SET_LABEL+"…",()=>openDetail(k)],["▶ 이 곡부터 재생",()=>{const list=items.map((x)=>({key:x.key,title:x.title,inst:x.plInst||""}));
        playFrom(list,list.findIndex((x)=>x.key===k),S.view.kind==="pl"?"pl:"+S.view.id:S.view.kind,viewName());}],["다음에 재생",()=>queueAdd(k,true)],["현재 재생목록 끝에 담기",()=>queueAdd(k,false)],["+ 재생목록에 담기",()=>addMenu(e,[k])],["합주 인원 지정…",()=>ensMenu(e,[k],ensOf(it))],
        ["인사 프리셋…",()=>greetMenu(e,k,it)]];
      {const sid=songIdOf(it||{key:k});if(sid)m.push([`번호 ${songTag(sid)} 복사`,()=>copySongTag(sid)]);
        if(sid)m.push(["커버 고르기…",()=>pickCover(it||{key:k,title:k})]);}   // 밖(폰)에서도 — 있는 그림 중에서 고르기 (올리기는 감춘다)
      if(S.view.kind==="pl"){m.push(["이 곡 악기 지정…",()=>plInstPick(S.view.id,k,it)]);m.push(["목록에서 제거",async()=>{await listsApi({op:"remove",id:S.view.id,keys:[k]});render();}]);}

function renderSel(){const n=S.selected.size;$("selbar").hidden=!n;
  // 줄의 「고름」 표시는 **개수와 상관없이** 늘 맞춘다 — 예전에는 여기 위의 return 때문에
  // 「해제」를 눌러도 줄이 계속 골라진 것처럼 보였다.
  document.querySelectorAll(".row").forEach((t)=>t.classList.toggle("sel",S.selected.has(t.dataset.k)));
  document.body.classList.toggle("selon",!!n);   // 막대가 떠 있는 동안 목록 끝에 여백 (CSS)
  if(!n)return;
  $("selN").textContent=`선택 ${n}`;const inPl=S.view.kind==="pl";$("bRemove").hidden=!inPl;$("bUp").hidden=$("bDown").hidden=!(inPl&&n===1);}
const selItems=()=>(S._items||[]).filter((i)=>S.selected.has(i.key));
/* 목록에서 **끌어서 여러 곡 고르기**.
   누른 줄에서 6px 넘게 움직이면 고르기가 시작되고, 지나간 줄까지가 한 묶음으로 잡힌다.
   처음 누른 줄이 이미 골라져 있었으면 지나가는 줄을 **푼다** (같은 손짓으로 풀기도 된다).
   끌고 나면 그 클릭은 삼킨다 — 안 그러면 손을 떼는 순간 처음 줄이 도로 뒤집힌다. */
(function(){const g=$("list");let on=false,moved=false,y0=0,i0=-1,mode=true,base=null,rows=[];
  const rowAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest?e.closest(".row"):null;};
  g.addEventListener("pointerdown",(e)=>{
    if(e.pointerType==="touch")return;        // 손가락은 화면을 내리려는 것이다 — 고르기로 치지 않는다
    if(e.button!==0)return;const r=rowAt(e.clientX,e.clientY);if(!r)return;
    rows=[...g.querySelectorAll(".row")];i0=rows.indexOf(r);if(i0<0)return;
    on=true;moved=false;y0=e.clientY;mode=!S.selected.has(r.dataset.k);base=new Set(S.selected);});
  g.addEventListener("pointermove",(e)=>{if(!on)return;
    if(!moved){if(Math.abs(e.clientY-y0)<6)return;moved=true;g.classList.add("dragsel");try{g.setPointerCapture(e.pointerId);}catch{}}
    const r=rowAt(e.clientX,e.clientY);const i1=r?rows.indexOf(r):-1;if(i1<0)return;
    const a=Math.min(i0,i1),b=Math.max(i0,i1);
    S.selected=new Set(base);
    for(let i=a;i<=b;i++){const k=rows[i]&&rows[i].dataset.k;if(!k)continue;if(mode)S.selected.add(k);else S.selected.delete(k);}
    renderSel();});
  const up=()=>{if(!on)return;on=false;g.classList.remove("dragsel");
    // 끌고 난 **바로 다음** 클릭만 삼킨다. 예전에는 once 처리기를 걸어 두기만 해서, 목록 밖에서 손을
    // 떼면(클릭이 안 온다) 그대로 무장된 채 남아 **나중에 누른 줄의 클릭을 먹었다**.
    if(!moved)return;
    const eat=(ev)=>{ev.stopPropagation();ev.preventDefault();};
    g.addEventListener("click",eat,{capture:true,once:true});
    setTimeout(()=>g.removeEventListener("click",eat,{capture:true}),300);};
  g.addEventListener("pointerup",up);g.addEventListener("pointercancel",up);g.addEventListener("pointerleave",up);})();
/* **폰에서 줄 메뉴 — 길게 누르기**. 아이폰 사파리는 길게 눌러도 `contextmenu` 를
   내지 않는다 — 그래서 줄 메뉴(곡 설정·이 곡부터 재생·담기·인원·인사·커버)가 폰에서는 **닿을 길이 없었다**
   (PC 는 오른쪽 단추). 손가락으로 500ms 누르고 있으면 같은 메뉴를 연다. 움직이면(스크롤) 취소.
   메뉴가 뜬 뒤 손을 떼며 나는 click 은 삼킨다 — 안 그러면 그 줄의 고름이 뒤집히고 메뉴도 바로 닫힌다.
   안드로이드는 제 `contextmenu` 도 내므로, 우리가 이미 열었으면 그것은 삼킨다 (두 번 열리지 않게). */
(function(){const g=$("list");let tm=0,x0=0,y0=0,row=null,fired=false;
  const stop=()=>{if(tm){clearTimeout(tm);tm=0;}};
  g.addEventListener("pointerdown",(e)=>{if(e.pointerType!=="touch")return;
    const r=e.target&&e.target.closest?e.target.closest(".row"):null;if(!r)return;
    row=r;x0=e.clientX;y0=e.clientY;fired=false;stop();
    tm=setTimeout(()=>{tm=0;if(!row||!row.oncontextmenu)return;fired=true;
      /* 손을 떼며 나는 click 은 **문서 전체에서** 한 번 삼킨다 — 메뉴가 손가락 자리에 뜨므로 그 click 은 줄이 아니라
         메뉴 위에 떨어진다(좁은 폭 360 실측: 메뉴가 뜨자마자 닫혔다 · 운 나쁘면 첫 항목이 눌린다) */
      const eat=(ev)=>{fired=false;ev.stopPropagation();ev.preventDefault();};
      document.addEventListener("click",eat,{capture:true,once:true});
      setTimeout(()=>document.removeEventListener("click",eat,{capture:true}),1500);
      row.oncontextmenu({preventDefault(){},clientX:x0,clientY:y0,target:row});},500);});
  g.addEventListener("pointermove",(e)=>{if(tm&&(Math.abs(e.clientX-x0)>8||Math.abs(e.clientY-y0)>8))stop();});
  g.addEventListener("pointerup",stop);g.addEventListener("pointercancel",stop);
  g.addEventListener("contextmenu",(e)=>{if(!fired)return;e.stopPropagation();e.preventDefault();},true);})();
$("bClear").onclick=()=>{S.selected.clear();renderSel();};
$("bPlay").onclick=()=>{const list=selItems().map((it)=>({key:it.key,title:it.title,inst:it.plInst||""}));S.selected.clear();renderSel();

async function move(dir){const pl=S.lists.find((p)=>p.id===S.view.id);if(!pl)return;const keys=pl.items.map((x)=>x.key);const k=[...S.selected][0];const i=keys.indexOf(k);const j=i+dir;if(i<0||j<0||j>=keys.length)return;keys.splice(j,0,keys.splice(i,1)[0]);await listsApi({op:"reorder",id:pl.id,items:keys});render();}

/* 새 재생목록 하나. 이름을 묻고 만든 뒤 **새로 생긴 것**을 찾아 돌려준다
   (예전엔 목록의 마지막 것을 썼는데, 서버가 순서를 바꾸면 엉뚱한 목록에 담긴다). */
async function newList(){
  const name=await ask("새 재생목록 이름",nextListName());
  if(name===null)return null;
  const before=new Set(S.lists.map((p)=>p.id));
  const r=await listsApi({op:"create",name:name||nextListName()});
  if(!r||r.ok===false)return null;
  return S.lists.find((p)=>!before.has(p.id))||S.lists.at(-1)||null;}
function nextListName(){const base="새 재생목록";const have=new Set(S.lists.map((p)=>p.name));if(!have.has(base))return base;for(let i=2;i<999;i++)if(!have.has(`${base} ${i}`))return `${base} ${i}`;return base;}
function addMenu(e,keys){if(!keys.length)return;menu(e,[[`${keys.length}곡 담기`,null]].concat(S.lists.map((p)=>[`${p.name} (${p.items.length})`,async()=>{await listsApi({op:"add",id:p.id,keys});S.selected.clear();render();toast(`「${p.name}」에 담았습니다`,2500,"ok");}])).concat([["+ 새 재생목록 만들어 담기",async()=>{const pl=await newList();if(!pl)return;
    await listsApi({op:"add",id:pl.id,keys});S.selected.clear();setView({kind:"pl",id:pl.id});
    toast(`「${pl.name}」을 만들고 ${keys.length}곡을 담았습니다`,2600,"ok");}]]));}
/* 곡별 인사 프리셋 — 이 곡을 틀 때 쓸 시작 인사를 지정한다 (없으면 기본 프리셋).
   프리셋 자체는 별도 페이지(greet.html)에서 만든다. */
/* 곡별 인사 지정 — **화면으로 넘어간다** (설정과 같은 모양으로).

   예전에는 여기서 작은 메뉴를 띄워 프리셋을 골랐다. 그 메뉴는 폰에서 화면 절반을
   가리고, 목록이 길면 잘리고, 「만들기·편집」을 누르면 어차피 화면이 넘어갔다 —
   **같은 일을 두 가지 모양으로** 하고 있었던 셈이다.

   곡 정보는 주소에 싣는다. 제목은 보여 주기용이고 판단은 `key` 로 한다. */
function greetMenu(e, key, it) {

/* 합주 인원 지정 — 게임이 안 알려 주는 값이라 사용자가 적는다. 여러 곡을 한 번에 지정할 수 있다. */

    for(const k of keys){const it=S.byKey.get(k);if(it)it.ens=n||null;}
    S.selected.clear();render();toast(n?`${keys.length}곡을 ${n}인으로 지정했습니다`:`${keys.length}곡의 인원 지정을 지웠습니다`,2500,"ok");};
  menu(e,[[`합주 인원 (${keys.length}곡)`,null],["1인 · 솔로",()=>set(1)],["2인",()=>set(2)],["3인",()=>set(3)],
    ["4인",()=>set(4)],["5인",()=>set(5)],["6인",()=>set(6)],["직접 입력…",async()=>{const v=await ask("합주 인원 (1~12)",String(cur||""));
      if(v===null)return;const n=Math.max(0,Math.min(12,parseInt(v,10)||0));set(n);}],["지정 지우기",()=>set(0)]]);}

/* ── 곡별 악기 ──
   엔진은 재생목록 항목마다 `inst` 를 들고 있고, 대기열도 곡마다 `inst` 를 들고 재생할 때 그 악기로 바꿔 든다
   (`play(title, inst)`). 화면에서 그 값을 **적는 자리**가 이것이다 — 세 길이 한 시트(pickInst)를 쓴다:
     · 현재곡 칸의 악기 단추 = **지금 곡에 저장** (/api/queue/inst — 대기열이 재생목록에서 왔으면 그 목록에도)
     · 줄의 「이 곡 악기 지정…」 = 재생목록 항목(set_inst) · 현재 재생목록 항목(/api/queue/inst)
     · 펼친 플레이어의 다음 곡 줄을 누르면 그 곡
   예전 모양(옛 모비폴리오)은 현재곡 칸이 〈select〉 였고 그 값은 「장착」에만 쓰였다 — 곡에 저장되지 않았다. */
const curItem=()=>(S.qi>=0&&S.queue[S.qi])?S.queue[S.qi]:null;
function instBoxSync(){const it=curItem();let t;const pin=S.settings.inst_pin||"";
  $("instPin").hidden=!pin;$("instBtn").classList.toggle("pinned",!!pin);
  if(pin){$("instT").textContent=instLabel(pin);
    $("instBtn").title=`악기 고정 중 — 모든 곡을 ${instLabel(pin)} 로 재생합니다 (누르면 목록 · 핀을 끄면 풀립니다)`;return;}
  if(it&&it.inst)t=instLabel(it.inst);
  else if(!it&&S.instrument)t=instLabel(S.instrument);
  else if(S.settings.default_inst)t=`기본 · ${instLabel(S.settings.default_inst)}`;
  else t=S.instSeen?`그대로 · ${instLabel(S.instSeen)}`:"악기 그대로";

  $("instBtn").title=it?`「${it.song||it.title}」에 쓸 악기 — 누르면 목록이 올라옵니다 (이 곡에 저장)`:"장착할 악기 — 누르면 목록이 올라옵니다";}
/* 악기 고르기 시트. 브라우저 기본 〈select〉 는 목록이 미니 창을 덮고 밖으로 삐져나왔다 —
   앱 안에서 스크롤되는 시트로 바꿨다. 양식은 **오버레이 악기 고르기와 같다**:
   종류 탭 · 검색(낱말 전부 · 접두 제외 — MFPick) · 「장착」 · 고정. 곡에 저장하는 길(곡별 악기)이면

/* 시트의 줄들 — 「기본」(곡별 지정) · 악기 줄([종류] 접두 · 금색 = 지금 악기 · 고정 핀 · 장착 배지) · 빈 목록 안내.

async function playFrom(list,index,src,name){

  S.qnext=r.next||null;S.qgen=r.gen||S.qgen;instBoxSync();
  const it=(r.now||null);const play=r.play||{};
  if(it){const lib=libOf(it);S.now={key:it.key,title:it.title,song:lib?(lib.song||lib.cleaned):(it.song||it.title),artist:(lib&&lib.artist)||it.artist||""};}
  if(!play.ok&&play.error==="riding"){   // 탈것 위 — 서버가 보내지 않고 기다린다. 내리면 서버가 이어서 튼다
    // 설정이 꺼져 있으면 켜는 길을 알려 준다 (켜져 있는데 못 내렸으면 서버가 준 까닭 그대로)

      :"탈것에서 내린 뒤 재생하세요 — 설정 → 연주 「탈것이면 날개 5 로 내리고 재생」을 켜면 자동으로 내립니다",5000);
    mountSync({mounted:true,wait_mount:true});setNow(S.now?S.now.song:"대기","탈것 탑승 중 — 내리면 이어서 재생");
    renderQueue();renderList();startPoll();return;}
  if(!play.ok){S.playing=false;setMain(false);setNow(S.now?S.now.song:"대기","실패: "+(play.message||play.error||""));renderQueue();renderList();return;}
  S.playing=true;S.startedAt=Date.now();S.manualStop=false;ensReset();setMain(true);startPoll();

function startPoll(){clearInterval(S.pollT);S.pollT=setInterval(pollAct,1000);}
async function stopAll(msg){clearInterval(S.pollT);S.pollT=null;clearTimeout(S.gapT);S.gapT=null;S.playing=false;setMain(false);ensReset();
  setNow(S.now?S.now.song:"대기",msg||"대기");setProg(0);renderQueue();renderList();}
let pollBusy=false;
async function pollAct(){if(S.switching||pollBusy)return;pollBusy=true;try{
  if(!S.playing&&S.qi<0){clearInterval(S.pollT);S.pollT=null;return;}   // 대기열이 있으면 계속 본다
  const gen=S.gen;const nw=await api("/api/now");if(S.switching||gen!==S.gen||!S.pollT)return;
  if(!nw||!nw.ok){S.pollErr=(S.pollErr||0)+1;if(S.pollErr>=5){S.pollErr=0;await stopAll("CLI 응답 없음");}return;}
  S.pollErr=0;const p=nw.perf||{};const s=S.settings;const sinceStart=(Date.now()-S.startedAt)/1000;
  mountSync(nw);bcSync(nw.bc);
  ensFromNow(nw);
  askFromNow(nw);
  // 악기는 **오버레이와 한 몸**이다 — 게임이 알려 주는 「지금 든 악기」를 기억해 두고, 곡에 저장된
  // 악기가 없을 때 칸에 「그대로 · [종류] 이름」 으로 비춘다.
  if(p.InstrumentName&&p.InstrumentName!==S.instSeen){S.instSeen=p.InstrumentName;instBoxSync();}
  const qn=nw.queue||{};
  if(qn.gen!==S.qgen||qn.rev!==S.qrev)await qPull();          // 서버가 차례·자리를 바꿨다 (다음 곡·셔플)
  if(nw.gap>0){S.playing=false;setMain(false);setNow(S.now?S.now.song:"대기",`다음 곡까지 ${Math.ceil(nw.gap)}초…`);return;}
  // 모비웍스 큐에 곡 경계에서 양보했고, 큐가 일을 끝내며 **이어서 틀지 않고** 멈춘 채로 뒀다 (engine.work_release) —
  // ■ 과 이 한 줄. 다음 곡은 사람이 ▶ 를 눌러야 간다
  if(nw.work_stop&&!p.IsPlaying){S.playing=false;setMain(false);setNow(S.now?S.now.song:"대기","작업에 양보해 멈춤 — ▶ 로 이어서 재생");return;}
  // 서버 엔진이 다음 곡을 시작했으면 화면도 그 곡으로 (전체 반복에서 미니만 멈춰 있던 것)
  // 탈것에서 내려 서버가 미뤄 둔 곡을 이어서 튼 경우도 여기로 온다 (같은 곡이지만 이 창은 「안 치는 중」이었다)
  if(nw.playing&&(!S.playing||!S.now||tkey(nw.title)!==tkey(S.now.title))){
    const it=S.queue[S.qi];if(it){const lib=libOf(it);
      S.now={key:it.key,title:it.title,song:lib?(lib.song||lib.cleaned):(it.song||it.title),artist:(lib&&lib.artist)||it.artist||""};}
    S.playing=true;S.startedAt=Date.now()-(nw.el||0)*1000;S.manualStop=false;ensReset();setMain(true);renderQueue();renderList();}
  if(p.IsPlaying){const cached=(S.byTitle.get(S.now?.title)||{}).duration||0;const tot=p.TotalDurationSeconds||cached||0,el=elFix(p.ElapsedSeconds||0,tot,p.IsLoop);
    if(el>0&&S.startedAt>Date.now()-el*1000-1500)S.startedAt=Date.now()-el*1000;const localEl=(Date.now()-S.startedAt)/1000;S.lastRemain=tot?tot-el:null;
    setNow(S.now.song,`${S.ens.on?`합주 ${S.ens.n+1}명 · `:""}${p.InstrumentName?instLabel(p.InstrumentName):""}${p.IsLoop?" · 반복 설정":""}${S.queue.length>1?` · ${S.qi+1}/${S.queue.length}`:""}${S.repeat==="one"?" · 한 곡 반복":S.repeat==="all"?" · 전체 반복":""}`);
    setTime(el,tot);setProg(tot?el/tot*100:0);
    // 다음 곡으로 넘기는 일은 **서버 엔진**이 한다 (여기서 또 넘기면 두 칸씩 간다).
    // 합주 중에는 서버가 넘기지 않는다 — 붙어 있는 사람들이 계속 치기 때문이다.
  }else if(S.playing){if(sinceStart<2.5)return;
    S.playing=false;setMain(false);
    if(S.manualStop){stopAll("정지됨");return;}
    setNow(S.now?S.now.song:"대기",S.qi>=0&&(S.queue.length>1||S.repeat!=="off")?"다음 곡 준비 중…":"연주 종료");}
  }finally{pollBusy=false;}}
async function mainToggle(){if(S.switching)return;
  if(S.playing||S.gapT){S.manualStop=true;clearTimeout(S.gapT);S.gapT=null;S.gen++;const r=S.playing?await api("/api/stop",{}):{ok:true};
    if(r.ok)await stopAll("정지됨");else{S.manualStop=false;setNow(S.now?S.now.song:"대기","정지 실패: "+(r.message||r.error||""));}}
  else if(S.qi>=0&&S.queue[S.qi])await playAt(S.qi);
  else{const k=[...S.selected][0];const it=k&&S.byKey.get(k);if(it)playFrom([{key:k,title:it.title,inst:""}],0,"single");else toast("곡을 두 번 누르거나, 고른 뒤 ▶ 를 누르세요",3000);}}
$("btnMain").onclick=(e)=>{e.stopPropagation();mainToggle();};$("sMain").onclick=mainToggle;
const goNext=()=>{if(!S.queue.length||S.switching)return;qStep(1);};
const goPrev=async()=>{if(!S.queue.length||S.switching)return;
  const el=(Date.now()-S.startedAt)/1000;if(S.playing&&el>4)await playAt(S.qi);else await qStep(-1);};
$("btnNext").onclick=(e)=>{e.stopPropagation();goNext();};$("sNext").onclick=goNext;
$("btnPrev").onclick=(e)=>{e.stopPropagation();goPrev();};$("sPrev").onclick=goPrev;
$("btnShuffle").onclick=()=>{setShuffle(!S.shuffle);toast(S.shuffle?"셔플 켬 — 목록을 섞어 그 차례로":"셔플 끔 — 목록 순서대로",2200,"ok");};
function setShuffle(on,save){S.shuffle=!!on;$("btnShuffle").classList.toggle("on",S.shuffle);
  if(save!==false){S.settings.shuffle=S.shuffle;S.cfgHold=Date.now()+1500;
    api("/api/settings",{settings:{shuffle:S.shuffle}}).then(()=>qPull()).catch(()=>{});}   // 차례는 서버가 다시 만든다
  else renderQueue();}
/* 반복 세 단계 — 한 곡 → 전체 → 끔 */
const REPEAT=[{v:"one",ic:"#ic-rep-one",t:"한 곡 반복 — 지금 곡만 계속"},{v:"all",ic:"#ic-rep",t:"전체 반복 — 목록 끝나면 처음으로"},{v:"off",ic:"#ic-rep-off",t:"반복 끔 — 목록 끝나면 정지"}];
/* 반복·셔플은 **오버레이와 같은 값**이다 — 설정에 저장한다.
   따로 놀던 때는 오버레이에서 「전체 반복」을 켜도 미니가 모른 채 목록 끝에서 멈췄다.
   미니 쪽은 저장도 안 해서 켤 때마다 「끔」으로 돌아갔다. */
function setRepeat(v,save){S.repeat=v;const r=REPEAT.find((x)=>x.v===v)||REPEAT[2];
  $("repIcon").innerHTML=`<use href="${r.ic}"/>`;$("btnRepeat").title=r.t;$("btnRepeat").classList.toggle("on",v!=="off");
  if(save!==false){S.settings.repeat=v;S.cfgHold=Date.now()+1500;api("/api/settings",{settings:{repeat:v}}).catch(()=>{});}}
$("btnRepeat").onclick=()=>{const i=REPEAT.findIndex((x)=>x.v===S.repeat);const v=REPEAT[(i+1)%REPEAT.length].v;
  setRepeat(v);toast(REPEAT.find((x)=>x.v===v).t,2200,"ok");};

/* ── 설정 ──
   설정은 **별개 페이지**다 (`settings.html`). 예전에는 이 창 안의 모달이었는데
   항목이 늘면서 좁은 창에 다 들어가지 않았다. 같은 창에서 옮겨 가고 「← 돌아가기」로 돌아온다.
   옮겨 가는 동안 「창이 닫혔다」로 오해받지 않게 아래 pagehide 에서 신호를 보내지 않는다. */
function openSettings(){goingInside=true;location.href="/folio/settings.html";}
/* 방송 — 머리줄 알약. 서버 답(`/api/now`·`/api/queue` 의 bc)으로 켜짐·대기 수를 그린다 */
function bcSync(bc){if(!bc||typeof bc.on!=="boolean")return;const b=$("btnBc");
  b.classList.toggle("live",bc.on);$("bcT").textContent=bc.on?"방송 · 신청":"방송";$("bcN").textContent=String(Number(bc.wait)||0);
  b.title=bc.on?"방송 중 — 누르면 방송 창":"방송 창 열기";}
/* 이 PC 는 방송 창(따로 뜨는 앱 창)을 띄우거나 앞으로, 모바일은 같은 화면으로 옮겨 간다 */
$("btnBc").onclick=async()=>{
  if(REMOTE){goingInside=true;location.href="/folio/broadcast.html";return;}
  const r=await api("/api/bc/window",{});
  if(!r||r.ok===false){toast("방송 창을 열지 못했습니다: "+((r&&(r.message||r.error))||""));return;}
  if(r.opened===false){goingInside=true;location.href="/folio/broadcast.html";}};   // 창을 못 띄우는 판(개발 서버) — 이 창에서 연다
$("btnSet").onclick=openSettings;
/* 연주 인사는 **따로 있는 페이지**다 (설정 안이 아니라 도구줄에 자기 단추로) */
$("btnGreet").onclick=()=>{goingInside=true;location.href="/folio/greet.html";};
/* 연결 끊기 — 밖에서 볼 때만 보인다. 이 기기가 들고 있던 쪽지·기기 열쇠·PC 주소를 전부 지우고
   잇기 화면으로 돌아간다. PC 쪽 쪽지도 같이 무효로 만든다 (그냥 지우면 12시간 동안 살아 있다). */
/* 단추는 늘 숨김 — ☰ 메뉴의 「연결 끊기」가 이 동작을 부른다 */
$("btnOut").hidden=!REMOTE;
$("btnOut").onclick=async()=>{
  if(!await MF.ask({title:"연결 끊기",
    text:"이 기기에 저장된 연결을 지웁니다. 다시 쓰려면 PC 에서 코드를 새로 받아야 합니다.",
    ok:"끊기",danger:true}))return;
  // **MF.api 를 쓰지 않는다** — 그쪽은 앞에 /api/folio/ 를 붙이고, 서버는 폴리오 쪽 remote/* 를
  // 넘기지 않는다(늘 404). 이 길은 모비웍스 문 앞(server.py `/api/remote/logout`)이고 쪽지 헤더로 끊는다.
  const ses=MF.session()||{};
  try{await fetch((ses.url||"")+"/api/remote/logout",{method:"POST",mode:"cors",
    headers:{"Content-Type":"application/json","X-Requested-With":"mobiworks","X-MobiWorks-Remote":ses.token||""},body:"{}"});}
  catch(e){/* PC 가 꺼져 있어도 이 기기 것은 지운다 */}
  MF.forget();
  goingInside=true;                       // 창이 닫힌다는 신호를 보내지 않게
  location.replace("/");                  // 뒤로 가기로 돌아오지 못하게
};

/* 업데이트는 **모비웍스 설정**에서 한다 (∞ → 설정). 폴리오 쪽 길(/api/folio/update/*)은 서버가
   넘기지 않아(FOLIO_NEVER_PREFIX) 여기 있던 알림 줄은 늘 404 였다 — 걷어냈다. */
/* ── 시작 ── */
(async()=>{setRepeat("off",false);await refreshState();await loadAll();
  // 시작할 때 자동 갱신은 **이 PC 에서만** — 폰은 방금 받은 것이 곧 PC 가 읽은 값이다
  if(S.settings.auto_sync&&!REMOTE&&S.cliOk)$("btnSync").click();
  // 「게임에서 이미 연주 중인가」 — 이 PC 는 게임에 묻고(`/api/activity`), 폰은 PC 감시 스레드가 마지막으로 본 값(`/api/now` 의 perf)으로 같은 판정을 한다
  if(S.cliOk){let p=null;
    if(REMOTE){const nw=await api("/api/now");p=nw&&nw.ok!==false&&nw.perf?nw.perf:null;}
    else{const a=await api("/api/activity");p=a&&a.ok&&a.body&&a.body.Performance;}
    if(p&&p.IsPlaying){S.now={key:"",title:"",song:p.MusicTitle||"게임에서 재생 중",artist:""};S.playing=true;S.startedAt=Date.now()-(p.ElapsedSeconds||0)*1000;S.gen++;setNow(S.now.song,"게임에서 재생 중");setMain(true);startPoll();}}
  await qPull(true).catch(()=>{});             // 서버가 들고 있는 대기열을 그대로 이어받는다 (보기는 그대로)
  if(S.queue.length&&S.qi>=0){const nw=await api("/api/now");
    if(nw&&nw.playing){const it=S.queue[S.qi];const lib=it?libOf(it):null;
      S.now={key:(it||{}).key||"",title:(it||{}).title||"",song:lib?(lib.song||lib.cleaned):((it||{}).song||nw.title),artist:(lib&&lib.artist)||""};
      S.playing=true;S.startedAt=Date.now()-(nw.el||0)*1000;S.gen++;setMain(true);setNow(S.now.song,"재생 중");startPoll();}}
  ovSync().catch(()=>{});setInterval(()=>ovSync().catch(()=>{}),5000);
  setInterval(()=>cfgSync().catch(()=>{}),3000);
  setInterval(refreshState,15000);})();
</script>
<script src="/js/shell.js"></script>
</body>
