<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Cards</title>
<!-- 연출 글꼴 — Noto Sans KR 300·400·700·900 · Space Mono 400·700.
     이 화면은 CSP(font-src 'self')를 지나므로 Google Fonts 링크 대신 **파일을 실어** 같은 글꼴을 쓴다.
     출처·라이선스는 fonts/README.md.
     못 읽으면 각 테마의 대체 글꼴("Noto Sans KR", "Malgun Gothic" · "Space Mono", Consolas)로 그려진다. -->
<link href="/folio/fonts/fonts.css" rel="stylesheet">
<style>
  /* 게임 화면 위에 WebView2(투명 배경, DirectComposition)로 얹는 합주 시작 연출 — **호스트**.
     연출 자체는 테마 팩이 그린다 (ui/folio/themes/<이름>/theme.css · theme.js).
     이 페이지는 곡 목록·대기열·설정을 서버에서 받고, 고른 팩을 붙이고, playOpening 을 연다.
     바탕은 투명이다(게임이 비친다). 팩의 뿌리(.op-theme)가 창 전체를 덮는다. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  body { user-select: none; -webkit-user-select: none; cursor: default; }
  .op-theme { position: fixed; inset: 0; pointer-events: none; }
  /* 무대는 연출이 시작할 때만 보인다 — 창이 보이는 순간 먼저 붙어 있던 팩(앱을 켤 때 붙인 것)의 대기 화면(링·띠·폰)이
     잠깐 보였다가 이번 팩으로 바뀌어 다른 것과 순간 겹쳐 보였다. run 이 팩을 고른 뒤에 켠다. */
  #opStage[hidden] { display: none; }
</style>
</head>
<body>

<div id="opStage" hidden></div>

<script src="/folio/net.js"></script>
<script src="/folio/themes/host.js"></script>
<script>
/* ────────────────────────────────────────────────
   0. 테마 팩 (기본 카드형, 설정에서 고른다)
      설정 `opening_theme`(store.py — 팩 이름 넷과 `random` 만 받는다)이 고른 팩을 붙인다. `random` 은 연출마다 넷 중 하나. 설정은 연출마다 곡 목록과 같이 다시 읽고
      (아래 loadLibrary), 바뀌었으면 **연출과 연출 사이에** 갈아 끼운다 — 페이지를 다시 읽지 않는다 (웜 스타트 그대로).
      팩 파일은 페이지가 뜰 때 넷 다 받아 둔다(붙이는 것은 고른 하나). 갈아 끼울 때 파일을 기다리면 그만큼
      연출이 늦게 시작해 6.5초 뒤 창이 숨을 때 퇴장 끝이 잘린다 (folio/opening_wv.py HIDE_PAD).
      파일은 `script-src 'self'`·`style-src 'self'` 로 들어온다 — 인라인이 아니라 CSP 해시가 필요 없다.
   ──────────────────────────────────────────────── */
const THEMES = ["card", "film", "ticket", "phone"];   // 화이트리스트 — store._ENUMS["opening_theme"] 와 같아야 한다 (tests/test_opening_themes.py)
const THEME_DEFAULT = "card";
const stage = document.getElementById("opStage");
let THEME_WANT = THEME_DEFAULT;               // 설정이 고른 팩 (모르는 값이면 기본)
// ?pack=film — 검사·스크린샷용으로 설정 대신 이 팩에 고정 (화이트리스트 밖이면 무시). `?theme=` 은 서버가 밝기(light·dark)로 쓴다
const THEME_PIN = (p => THEMES.includes(p) ? p : null)(new URLSearchParams(location.search).get("pack"));
if (THEME_PIN) THEME_WANT = THEME_PIN;
const packs = new Map();                      // 이름 → 파일을 다 받았다는 Promise (true = 등록됨)
const THEME_RANDOM = "random";              // 설정 값 — 연출마다 THEMES 에서 하나를 뽑는다 (팩 폴더는 없다)
function themeId(v) { if (v === THEME_RANDOM) return THEMES[Math.floor(Math.random() * THEMES.length)]; return THEMES.includes(v) ? v : THEME_DEFAULT; }
function loadPack(id) {
  id = themeId(id);
  if (packs.has(id)) return packs.get(id);
  const done = el => new Promise(res => { el.onload = () => res(true); el.onerror = () => res(false); });
  const css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = `/folio/themes/${id}/theme.css`;
  const js = document.createElement("script");
  js.src = `/folio/themes/${id}/theme.js`;
  const p = Promise.all([done(css), done(js)]).then(() => OpeningHost.has(id));
  document.head.appendChild(css);
  document.head.appendChild(js);
  packs.set(id, p);
  p.then(() => applyTheme());      // 다 받았으면 (연출 중이 아니면) 바로 붙인다 — 첫 연출 전에 링이 서 있게
  return p;
}
// 고른 팩으로 — 받아 둔 것만 붙인다. 아직이면 지금 것 그대로 (그 팩은 받는 대로 다음 판부터)
// swap=true 는 연출이 **시작하는** 순간(run)만 — 그때만 보이는 팩을 바꾼다. 연출 사이(목록을 새로 받을 때)에는 팩 파일을
// 미리 읽어 두기만 한다. 지난 연출이 화면을 옅게 두고 끝난 직후 팩을 바꾸면 새 팩의 **대기 화면**(링·띠)이 창이 아직
// 보이는 동안 튀어나왔다 — 「랜덤」이면 연출마다 그랬다.
function applyTheme(swap) {
  if (playing) return OpeningHost.active();
  const want = themeId(THEME_WANT);
  const cur = OpeningHost.active();
  if (cur && !swap) { if (!OpeningHost.has(want)) loadPack(want); return cur; }
  if (OpeningHost.has(want)) return OpeningHost.use(want, stage);
  loadPack(want);
  if (cur) return cur;
  return OpeningHost.has(THEME_DEFAULT) ? OpeningHost.use(THEME_DEFAULT, stage) : null;
}

/* ────────────────────────────────────────────────
   1. 보유 곡 목록 — 서버의 악보함(/api/folio/scores)에서 받는다.
      cover 는 **곡 번호의 그림** — `/folio/covers/<번호>`.
      사람이 `data/folio/covers/0012.png` 처럼 번호로 넣은 그림이 있으면 그것, 없으면 서버가 기본 풀에서
      번호로 정해진 한 장을 준다 (같은 곡은 늘 같은 기본 커버 — 링이 깜빡이지 않게).
      곡마다 고른 커버(미니 창 줄 메뉴 「커버 고르기…」)도 서버가 같은 주소 뒤에서 고른다.

      **주소는 서버가 준 `coverUrl`(`/folio/covers/12?v=…`) 을 그대로 쓴다.** 이 페이지는 앱을 켤 때 한 번 떠서
      하루 종일 산다(웜 스타트). 브라우저는 한 문서 안에서 같은 주소의 그림을 다시 받지 않으므로, 번호만 있는
      주소로는 그림을 넣거나 바꿔도 **앱을 다시 켤 때까지 옛 그림**이 나왔다 (헤드리스 실측).
      `?v=` 는 그림 파일의 모습이라 그림이 바뀌면 주소가 바뀐다.
      받은 목록은 OpeningHost 에 싣는다 (songs · total · queueKeys · pickKey) — 어느 팩이든 같은 목록을 쓴다.
   ──────────────────────────────────────────────── */
const UNKNOWN_COVER = "linear-gradient(160deg,#ccc,#777)";   // 번호가 없는 곡 (보관함에 없는 제목)
const COVER_URL_OK = /^\/folio\/covers\/(\d{1,9}|(pool|bundled)\/[A-Za-z0-9._%-]{1,80})\?v=[A-Za-z0-9]{1,40}$/;   // 서버가 주는 모양만 CSS 에 넣는다 (번호 · 기본 풀의 한 장)
function coverUrl(id, url) {
  const u = COVER_URL_OK.test(String(url || "")) ? String(url) : `/folio/covers/${Number(id)}`;
  return `url('${u}')`;
}
function coverOf(id, url) { return Number(id) > 0 ? coverUrl(id, url) : UNKNOWN_COVER; }

let OPENING_LAST = null;       // 서버가 마지막으로 낸 연출 {song, inst, at} — 카드의 악기 줄 (아래 instFor)
async function loadLibrary(song) {
  if (!window.MF || !MF.api) return;          // 서버 없이 열린 경우 (검사용) — 목록 없이 돈다
  // 설정은 `nocli=1` 로만 — 빼면 서버가 CLI 상태를 묻는다(게임을 건드리는 길). 여기서 쓰는 것은 opening_theme 뿐
  const [j, q, st] = await Promise.all([MF.api("/api/scores"), MF.api("/api/queue").catch(() => null),
                                        MF.api("/api/settings?nocli=1").catch(() => null)]);
  if (st && st.settings && !THEME_PIN) THEME_WANT = themeId(st.settings.opening_theme);
  const items = (j && Array.isArray(j.items)) ? j.items : [];
  if (!items.length) { applyTheme(); return; }
  OpeningHost.total = Number(j.songTotal) || 0;
  // 보관함에 없는 곡(남이 튼 합주곡)의 카드 — 기본 풀의 무작위 한 장 (서버가 부를 때마다 다르게 준다)
  OpeningHost.randomCover = COVER_URL_OK.test(String(j.randomCover || "")) ? `url('${j.randomCover}')` : null;
  // 악보함 순서 그대로 — 링의 앞은 대기열이, 나머지는 판마다 새로 섞은 무작위(host.seed)가 정한다 (카드형 ringCompose)
  const seen = new Map(), out = [];
  for (const it of items) {
    const title = String(it.song || it.cleaned || it.title || "").trim();
    if (!title) continue;
    const key = String(it.key || it.title || title);
    if (seen.has(title)) { seen.get(title).keys.push(key); continue; }   // 같은 제목의 다른 악보도 이 한 장으로
    const d = Number(it.duration);
    const id = Number(it.id) > 0 ? Number(it.id) : null;
    // gen: 생성 커버(`?v=g…` — 곡 제목이 그림에 이미 있다 → 링 카드의 제목 글씨를 겹쳐 쓰지 않는다) · sq: 정사각형 그림
    const e = { id, key, keys: [key], title, raw: String(it.title || ""), duration: d > 0 ? Math.round(d) : null, cover: coverOf(id, it.coverUrl),
                gen: id != null && /[?&]v=g/.test(String(it.coverUrl || "")), sq: id != null && it.coverSquare === true };
    seen.set(title, e);
    out.push(e);
  }
  OpeningHost.songs = out;
  if (q && q.ok !== false) {
    OpeningHost.queueKeys = Array.isArray(q.items) ? q.items.map(x => String((x && x.key) || "")).filter(Boolean) : [];
    OPENING_LAST = (q.opening && typeof q.opening === "object") ? q.opening : null;
  }
  const hit = song ? OpeningHost.findSong(song) : null;
  OpeningHost.pickKey = hit ? hit.key : (q && q.now && q.now.key ? String(q.now.key) : null);
  if (playing) return;           // 연출 중에는 팩을 안 건드린다 (다음에 다시 본다)
  const x = applyTheme();        // 처음이면 팩을 붙인다 · 이미 있으면 그대로 두고(바꾸는 것은 run) 새 팩 파일만 미리 읽는다
  if (x) x.refresh();            // 목록이 바뀌었으면 링·띠를 새로 짓는다
}
// 연출 직전에 목록을 새로 받는다 — 방금 고른 커버·방금 넣은 그림·**지금 재생목록**·**방금 고른 테마**가 이번 판에 나오게.
// 앱은 playOpening 을 부르자마자 창을 보이고 6.5초 뒤 숨기므로(opening_wv), 오래 기다리지 않는다 —
// 200ms 안에 안 오면 가진 목록으로 돌고, 늦게 온 목록은 다음 판에 쓰인다.
const LIB_WAIT = 200;
function freshLibrary(song) {
  return Promise.race([loadLibrary(song).catch(() => {}), new Promise(r => setTimeout(r, LIB_WAIT))]);
}

/* ────────────────────────────────────────────────
   3. 연출 — 팩이 그린다. 여기는 순서(겹치면 차례대로)와 악기 줄만.
   ──────────────────────────────────────────────── */
let playing = null;

async function playOpening({ song = "", players = [], badge = "", kicker = "", inst = "" } = {}) {
  if (!Array.isArray(players)) players = [];     // 밖에서 온 값 — 모양을 믿지 않는다 (보안)
  OpeningHost.newRound();       // 재생목록 밖의 나머지 곡을 이번 판에 새로 섞는다
  await freshLibrary(song);     // 방금 고른 커버·지금 재생목록·테마가 이번 판에 나오게 (200ms 까지만 기다린다)
  if (playing) await playing;   // 겹치면 순서대로
  playing = run({ song, players, badge, kicker, inst }).finally(() => {
    playing = null;
    loadLibrary().catch(() => {});   // 다음 판을 위해 목록을 새로 받아 둔다 (연출 중에는 팩을 안 건드린다)
  });
  return playing;
}

// 카드의 악기 줄 — 서버가 준 `inst`(engine.opening_fire, 「[피아노] 3화음 고결한 서약의 피아노」). 창 쪽이 넘기는 값에
// 그 칸이 빠지면(opening_wv 는 song·players·badge·kicker 만 넘긴다) 연출 직전에 받은 `/api/queue` 의 `opening`
// (서버가 방금 낸 연출)에서 같은 곡일 때만 가져온다. 모르면 "" — 줄을 감춘다.
const normSong = t => String(t || "").replace(/\s+/g, " ").trim().toLowerCase();
function instFor(song, given) {
  const g = String(given || "").trim();
  if (g) return g;
  const o = OPENING_LAST;
  if (!o || !o.inst || normSong(o.song) !== normSong(song)) return "";
  if (Number(o.at) > 0 && Math.abs(Date.now() / 1000 - Number(o.at)) > 60) return "";   // 지난 연출의 값은 쓰지 않는다
  return String(o.inst);
}

async function run({ song, players, badge, kicker, inst }) {
  const x = applyTheme(true);   // 설정이 바뀌었으면 여기서 (지난 연출은 끝났고 창이 다시 보이는 순간이다 — 대기 화면이 튀지 않는다)
  if (!x) return;               // 팩을 하나도 못 읽었다 — 그리지 않는다 (창은 6.5초 뒤 그대로 숨는다)
  const instText = instFor(song, inst);
  try { x.refresh(); } catch (e) { /* 새로 섞은 링·띠 — 못 지어도 가진 것으로 돈다 */ }
  stage.hidden = false;         // 팩을 고른 **뒤에** 무대를 켠다 — 먼저 붙어 있던 팩의 대기 화면이 먼저 보이지 않게
  try {
    await x.play({ song, players, badge, kicker, inst: instText });
  } finally {
    stage.hidden = true;        // 퇴장이 끝나면 다시 숨긴다 — 다음 연출까지 아무 팩도 안 보인다
  }
}

/* 글꼴 미리 읽기 — 창은 앱을 켤 때 미리 떠 있다(웜 스타트). 쓰는 굵기를 그때 다 읽어 두면
   첫 카드가 대체 글꼴로 나왔다가 바뀌는(font-display: swap) 일이 없다. 한글은 곡 제목마다
   다른 조각이 필요해 여기서는 자주 쓰는 글자만 읽고, 나머지는 쓰일 때 읽는다 (fonts/README.md). */
for (const f of ["300 1em \"Noto Sans KR\"", "400 1em \"Noto Sans KR\"", "700 1em \"Noto Sans KR\"",
                 "900 1em \"Noto Sans KR\"", "400 1em \"Space Mono\"", "700 1em \"Space Mono\""]) {
  document.fonts.load(f, "Aa09 솔로합주명외나").catch(() => {});
}

/* ────────────────────────────────────────────────
   4. 외부 호출 인터페이스
      앱(folio/opening_wv.py)은 ExecuteScript 로 playOpening({...}) 을 부른다.
   ──────────────────────────────────────────────── */
window.playOpening = playOpening;
window.addEventListener("message", e => {
  // 같은 출처만 받는다 — 아무 창이나 postMessage 로 연출을 띄우지 못하게 (보안). 앱은 ExecuteScript 로 직접 부른다.
  if (e.origin !== location.origin) return;
  const d = e.data;
  if (d && d.type === "opening") playOpening(d);
});
const q = new URLSearchParams(location.search);
{
  const dv = parseFloat(q.get("dim"));
  if (dv >= 0 && dv <= 0.35) OpeningHost.dimA = dv;     // 팩의 뿌리에 --dim-a 로 (붙일 때)
}
// URL 로 바로 재생: ?song=Emain%20Macha&players=[["",  "나"]]
if (q.get("song")) {
  let players = [];
  try { players = JSON.parse(q.get("players") || "[]"); } catch {}
  if (!Array.isArray(players)) players = [];     // ?players= 가 배열이 아니면 빈 것으로 (보안)
  setTimeout(() => playOpening({ song: q.get("song"), players, badge: q.get("badge") || "", kicker: q.get("kicker") || "", inst: q.get("inst") || "" }), 600);
}
// 팩 파일 — 기본(카드형)과 고른 것을 먼저, 나머지도 받아 둔다. 페이지의 load(= 앱의 「준비됨」)는 이 파일들을 기다린다.
loadPack(THEME_WANT);
for (const id of THEMES) loadPack(id);
loadLibrary().catch(() => {});
</script>
</body>
</html>
